<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI untuk UMKM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Asisten AI untuk UMKM</h1>
        <p>Cafeteria </p>
    </header>
    <nav>
        <a href="#profile">Profile</a>
        <a href="#formdata">Form</a>
    </nav>
    <section id="profile">
        <h3>Cafetaria dengan layanan AI terdepan</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-ZQmSmfBX-Ig8oynU8UMJnrLJoey29aEMM8lZQ2kdt0aBowU5vnwydPE&s" alt="Suasana cafetaria dengan layanan modern">
        <h4>Selamat Menikmati!!</h4>
    </section>
    <form id="formdata" action="#">
        <label for="nama">Masukkan Pesanan Anda</label>
        <input type="text" id="nama" name="nama">
        <fieldset id="jeniskelamin">
            <legend>Layanan Pesan Antar</legend>
            <input type="radio" name="layanan" id="layanan1">
            <label for="layanan1">Ambil Sendiri</label>
            <input type="radio" name="layanan" id="layanan2">
            <label for="layanan2">Pesan Antar</label>
        </fieldset>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
